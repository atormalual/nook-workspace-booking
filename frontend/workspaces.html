<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Explore Workspaces | Nook</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation bar -->
    <header>
        <div class="logo">nook.</div>

        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <!-- Workspace browsing section -->
    <main class="workspace-page">

        <h1>Explore Workspaces</h1>

        <p>
            Find the perfect space for your next productive day.
        </p>
            
            <!-- Filter workspaces by capacity and availability -->
        <div class="workspace-filter">

            <h2>Filter Workspaces</h2>

            <div class="filter-fields">

                <div class="filter-group">
                    <label for="capacity-filter">
                        Minimum Capacity
                    </label>
                    <input
                        type="number"
                        id="capacity-filter"
                        min="1"
                        value="1"
                    >
                </div>

                <div class="filter-group">
                    <label for="date-filter">
                        Booking Date
                    </label>
                    <input type="date" id="date-filter">
                </div>

                <div class="filter-group">
                    <label for="start-time-filter">
                        Start Time
                    </label>
                    <input type="time" id="start-time-filter">
                </div>

                <div class="filter-group">
                    <label for="end-time-filter">
                        End Time
                    </label>
                    <input type="time" id="end-time-filter">
                </div>

            </div>

            <div class="filter-actions">

                <label for="availability-filter"
                    class="availability-option">
                    <input type="checkbox" id="availability-filter">
                    Available Workspaces Only
                </label>

                <button id="filter-button">
                    Apply Filter
                </button>

            </div>

        </div>
        <!-- Workspace cards will appear here -->
        <section class="workspace-container" id="workspace-container">

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
